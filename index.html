<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Podcasts">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
<title>Podcasts</title>
</head>
<body>
<header>
  <h1 id="title">Favoris</h1>
  <button id="back" hidden aria-label="Retour">←</button>
</header>
<div id="install" hidden><p id="install-text"></p><button id="install-btn" hidden>Installer l'app</button></div>
<main id="view"></main>

<div id="player" hidden>
  <button id="collapse" class="wbtn" aria-label="Réduire le lecteur"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  <button id="expand" class="wbtn" aria-label="Plein écran"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h5v5M9 20H4v-5M20 4l-6.5 6.5M4 20l6.5-6.5"/></svg></button>
  <img id="np-art" alt="" style="visibility:hidden">
  <canvas id="viz"></canvas>
  <div class="np"><div class="tl"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div id="np-title"></div></div><div id="np-show"></div></div>
  <div class="ctl">
    <button id="prev" aria-label="Épisode précédent"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M6 5h2.2v14H6zM20 5.7v12.6a.8.8 0 0 1-1.27.65L10 12.65a.8.8 0 0 1 0-1.3l8.73-6.3A.8.8 0 0 1 20 5.7z"/></svg></button>
    <button id="rw" aria-label="Reculer 15 s">−15</button>
    <button id="pp" aria-label="Lecture/Pause"><svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></button>
    <button id="ff" aria-label="Avancer 30 s">+30</button>
    <button id="next" aria-label="Épisode suivant"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M15.8 5h2.2v14h-2.2zM4 5.7v12.6a.8.8 0 0 0 1.27.65L14 12.65a.8.8 0 0 0 0-1.3L5.27 5.05A.8.8 0 0 0 4 5.7z"/></svg></button>
  </div>
  <div class="ctl opts">
    <button id="night" aria-label="Mode nuit (adoucit les passages forts)" title="Mode nuit : adoucit les passages forts">Nuit</button>
    <button id="sleep" aria-label="Minuterie d'arrêt" title="Minuterie d'arrêt">Minuteur</button>
    <button id="vizreal" aria-label="Visualiseur : barres synchronisées sur le vrai son" title="Visualiseur : barres synchronisées sur le vrai son">Visualiseur</button>
  </div>
  <p id="viz-note" class="vnote"></p>
  <div class="times"><span id="t-cur">0:00</span><span id="t-tot">Total 0:00</span><span id="t-rem">-0:00</span></div>
  <div id="seek" role="slider" aria-label="Position de lecture" tabindex="0"><div class="trk"><div class="fil"></div></div><div class="thb"></div></div>
</div>
<audio id="audio" preload="none"></audio>

<nav>
  <button data-tab="favs" class="on">Favoris</button>
  <button data-tab="search">Recherche</button>
  <button data-tab="settings">Réglages</button>
</nav>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
